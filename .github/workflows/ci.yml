name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby:
    name: "Ruby ${{ matrix.ruby }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions README claims support for.
        ruby: ["3.2", "3.3", "3.4", "4.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - run: bundle exec rake test

  lint:
    name: "Rubocop"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Matches TargetRubyVersion in .rubocop.yml.
          ruby-version: "3.2"
          bundler-cache: true

      - run: bundle exec rubocop

  worker:
    name: "Worker"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No dependencies to install; the suite runs on node's own test runner.
      - run: npm test
        working-directory: worker
